version: 1
scripts:
  example.recover: lua/recover.lua
  example.power: lua/power.lua
  example.guard: lua/guard.lua
rules:
  - id: example.characterRecovery
    event: TURN_START
    handler: example.recover
    parameters: {amount: 5}
    binding: {scope: character, id: 0}
  - id: example.weaponPower
    event: ATTACK
    handler: example.power
    parameters: {amount: 10}
    binding: {scope: equipment, id: 0}
  - id: example.armorGuard
    event: HIT
    handler: example.guard
    parameters: {amount: 3}
    binding: {scope: equipment, id: 70}
  - id: example.characterEndRecovery
    event: TURN_END
    handler: example.recover
    parameters: {amount: 3}
    binding: {scope: character, id: 0}
