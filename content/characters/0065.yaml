intro: "자지경. 유비가 강남에 들어올 때 내응으로서 공을 세웠다. 나중에 위급한 상황의 관우를 구하지 않은 일로 유비에게 처벌받을까 두려워 위나라로 투항했다. 조비의 총애를 받아 파격적으로 승진했다. 후에 모반이 실패하자 사마의에게 살해당했다."
