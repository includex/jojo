intro: "자는 공사이다. 유비의 맏아들이자 촉나라의 마지막 주군이다. 어리석고 술과 색에 빠져 살았으며, 총애를 받은 환관 황호 때문에 나라의 힘이 쇠퇴했다. 위나라 군대가 회현을 공격할 때, 모두의 반대에도 불구하고 스스로 수레에 묶여 성 밖으로 나와 투항했다. 어리석은 군주의 대명사라고 할 수 있다."
