intro: "자는 계상이다. 사람들은 그를 백미 마량이라 부른다. 유비가 회현에 도착한 후, 그는 관우의 주요 책사였다. 그는 제갈량과 깊은 사이였고, 양을 형님으로 모셨다. 유비에게 의릉대전에서 싸우지 말라고 간언했으나 받아들여지지 않았다. 나중에 제갈량이 남쪽 원정을 떠날 때 병들어 촉나라에서 사망했다."
