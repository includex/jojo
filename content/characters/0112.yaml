intro: "본래 한복의 부하였다. 한복이 도망친 후, 그는 원씨를 도와 원담의 참모가 되었다. 조조에게 사신으로 갔을 때, 조조가 그에게 머무르라고 권유했지만, 그는 단호히 거절했다. 하지만 원담은 그의 동생 신비가 이미 조조에게 항복한 것을 보고 그를 의심했고, 이로 인해 그는 분노하여 죽었다."
