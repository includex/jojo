intro: "자는 국산이다. 촉나라의 군대에서 일하던 사마였다. 관우가 양양을 공격할 때, 관우에게 형주 방어에 신중할 것을 충고했다. 관우가 맥성에서 빠져나온 후, 그는 맥성에 목숨을 걸쳐 지켰다. 하지만 곧 관우의 사망 소식을 듣자 성루에서 뛰어내려 스스로 목숨을 끊었다."
