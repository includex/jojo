# Runtime override: -Djojo.ui.dialogue.path=/path/to/dialogue.yaml
# Missing values inherit each screen's established rendering defaults.
# layout accepts panel, portrait, speaker, text, and choice fields in logical screen pixels.
# Font keys: path, size, bold, faceIndex, color, borderWidth, borderColor, scaleX, scaleY.
# Colors must be quoted #RRGGBB or #RRGGBBAA; asset paths are packaged internal paths.
# Any font or layout customization disables recovered raster labels.
# legacyRaster: false forces live font rendering even without customization.
# followSpeaker: false uses fixed layout positions for battle dialogue.
version: 1
profiles:
  scenario:
    followSpeaker: false
    legacyRaster: false
    layout:
      panelLeftX: 34.4
      panelRightX: 34.4
      panelY: 27.52
      topOffsetY: 0
      panelWidth: 1210.88
      panelHeight: 209.84
      portraitLeftX: 53.32
      portraitRightX: 53.32
      portraitOffsetY: 15.48
      portraitWidth: 178.88
      portraitHeight: 178.88
      speakerLeftX: 256.28
      speakerRightX: 256.28
      speakerOffsetY: 185.76
      textLeftX: 256.28
      textRightX: 256.28
      textOffsetY: 141.04
      textWidth: 959.76
    bodyFont:
      size: 32
      scaleX: 0.86
      scaleY: 0.86
      color: "#211B17FF"
      borderWidth: 0
    speakerFont:
      size: 34
      bold: true
      scaleX: 0.86
      scaleY: 0.86
      color: "#723F25FF"
      borderWidth: 0
    background:
      fillColor: "#E4CFABFF"
      leftImage: maps/ui/unit-info/box3.png
      rightImage: maps/ui/unit-info/box3.png
      tint: "#B99B61FF"
      ninePatch: { enabled: true, left: 5, right: 5, top: 5, bottom: 5 }
  battle:
    # Battle canvas uses the native 1488.372 x 800 source coordinates.
    # Identical left/right positions keep narration and character lines stable.
    followSpeaker: false
    legacyRaster: false
    layout:
      panelLeftX: 40
      panelRightX: 40
      panelY: 32
      panelWidth: 1408
      panelHeight: 244
      portraitLeftX: 62
      portraitRightX: 62
      portraitOffsetY: 18
      portraitWidth: 208
      portraitHeight: 208
      speakerLeftX: 298
      speakerRightX: 298
      speakerOffsetY: 216
      textLeftX: 298
      textRightX: 298
      textOffsetY: 164
      textWidth: 1116
    bodyFont:
      size: 32
      scaleX: 1
      scaleY: 1
      color: "#211B17FF"
      borderWidth: 0
    speakerFont:
      size: 34
      bold: true
      scaleX: 1
      scaleY: 1
      color: "#723F25FF"
      borderWidth: 0
    background:
      fillColor: "#E4CFABFF"
      leftImage: maps/ui/unit-info/box3.png
      rightImage: maps/ui/unit-info/box3.png
